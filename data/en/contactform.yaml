# GitHub Pages only serves static files, so the form posts to Formspree.
# Create a form at https://formspree.io and replace YOUR_FORM_ID with its id.
action: https://formspree.io/f/YOUR_FORM_ID
placeholders: false
fields: 
- name: title
  input_type: html
  label: <h3>Send me a message</h3>
  required: true
- name: name
  input_type: text
  label: Name
  required: true
- name: email
  input_type: email
  label: Email address
  required: true
- name: message
  input_type: textarea
  label: Message
  required: true
- name: consent
  input_type: checkbox
  label: I agree that my details are processed to answer my message, as described in the <a href="/privacy-policy/">privacy policy</a>.
  required: true
- name: submit
  input_type: submit
  label: Send message
  required: true
